[package]
name = "rsclient"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Benchmark client using established Rust client functionality (redis-rs multiplexing and client-side caching)"

[dependencies]
redis = { version = "=1.7.1", default-features = false, features = ["aio", "tokio-comp", "cache-aio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
hdrhistogram = { version = "7", default-features = false }
