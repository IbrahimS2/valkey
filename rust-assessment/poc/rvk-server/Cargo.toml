[package]
name = "rvk-server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Proof-of-concept Rust-native server implementing a declared subset of the Valkey protocol"

[dependencies]
mio = { version = "1", features = ["os-poll", "net"] }
socket2 = { version = "0.6", features = ["all"] }
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
libc = "0.2"
tikv-jemallocator = "0.7"
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }

[dev-dependencies]
proptest = "1"
